name: Retail analytics checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: retail_ci
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: retail_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retail_ci -d retail_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: retail_ci
      PGPASSWORD: ephemeral_ci_password
      PGDATABASE: retail_ci
      RETAIL_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tests/integration.py
      - name: Create a separate inbox test database
        run: createdb retail_inbox_ci
      - run: python tests/inbox_integration.py
        env:
          PGDATABASE: retail_inbox_ci
  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned Airflow image
        run: docker build --file airflow/Dockerfile --tag retail-airflow-ci .
      - name: Validate DAG in the actual Airflow runtime
        run: docker run --rm --entrypoint python retail-airflow-ci /opt/retail/airflow/verify_dag.py
